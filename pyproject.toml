[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berth-scheduler"
version = "0.1.0"
description = "Berth allocation + quay-crane scheduling for container terminals: MIP exact, adaptive GA, FCFS baseline"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Lixiang" }]
keywords = ["berth-allocation", "quay-crane", "container-terminal", "scheduling", "MIP", "genetic-algorithm"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Operations Research",
]
dependencies = ["numpy>=1.22", "scipy>=1.9"]

[project.optional-dependencies]
viz = ["matplotlib"]
dev = ["pytest", "ruff", "matplotlib"]

[project.scripts]
berth-scheduler = "berth_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
